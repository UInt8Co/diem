name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test suite ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    # macOS 26 gives us the PQC crypto APIs (ML-DSA-65, X-Wing) at runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v3

      - name: Run tests
        run: swift test

  # ── Embedded WASM build ───────────────────────────────────────────────────
  embedded:
    name: Build Embedded WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v3

      - name: Install WASM Embedded Swift SDK
        run: |
          swift sdk install \
            "$(swift sdk list --available | grep wasm32-unknown-none-wasm | awk '{print $1}' | head -1)"

      - name: Build embedded targets
        run: bash Scripts/build-embedded.sh

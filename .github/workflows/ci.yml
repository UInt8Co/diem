name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Soundness checks (format, shellcheck, unacceptable language) ──────────
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.8
    with:
      # Pre-v1; no API stability contract yet.
      api_breakage_check_enabled: false
      # No license headers in this project.
      license_header_check_enabled: false
      # No DocC documentation target yet.
      docs_check_enabled: false

  # ── Linux test matrix (via Docker containers, multiple Swift versions) ────
  linux-tests:
    name: Linux Tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.8
    with:
      # macOS tests run in the separate custom job below.
      enable_macos_checks: false
      # Windows CI is not targeted.
      enable_windows_checks: false
      # Our package uses swiftLanguageModes: [.v6]; exclude pre-6.0 toolchains.
      linux_exclude_swift_versions: '[{"swift_version":"5.9"},{"swift_version":"5.10"}]'

  # ── macOS test suite (needs macOS 26 for PQC crypto APIs) ────────────────
  macos-tests:
    name: macOS Tests (Xcode 26.3)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftly
        run: |
          curl -fsSL https://swiftlang.github.io/swiftly/swiftly-install.sh \
            | bash -s -- -y --no-modify-profile
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift toolchain
        run: swiftly install --use "$(cat .swift-version)"

      - name: Run tests
        run: swiftly run swift test

  # ── Embedded WASM build (Foundation-free targets only) ───────────────────
  embedded:
    name: Embedded WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftly
        run: |
          curl -fsSL https://swiftlang.github.io/swiftly/swiftly-install.sh \
            | bash -s -- -y --no-modify-profile
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift toolchain
        run: swiftly install --use "$(cat .swift-version)"

      - name: Install WASM Embedded Swift SDK
        run: |
          swiftly run swift sdk install \
            "$(swiftly run swift sdk list --available | grep wasm32-unknown-none-wasm | awk '{print $1}' | head -1)"

      - name: Build embedded targets
        run: bash Scripts/build-embedded.sh

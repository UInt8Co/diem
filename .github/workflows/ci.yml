name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  crypto-linux:
    name: Portable cryptography
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"
      - name: Test portable contracts
        run: swift test -j 4
      - name: Build vector generator
        run: swift build --product diem-vectors -j 4
      - uses: swiftwasm/setup-swiftwasm@v2
        with:
          tag: swift-6.4.0-RELEASE
      - name: Compile portable core in Embedded mode
        run: swift build --swift-sdk swift-6.4.0-RELEASE_wasm-embedded --target Diem -c release -j 4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify independent WebCrypto and Java receivers
        run: |
          deno check Scripts/verify-vectors.ts
          deno run --allow-read Scripts/verify-vectors.ts
          deno run --allow-read --allow-run --allow-write Scripts/verify-hpke-vectors.ts

  # ── Test suite (macOS 26 for PQC crypto APIs) ─────────────────────────────
  test:
    name: Run Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ hashFiles('.swift-version') }}

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swiftly run swift test

  # ── Build and deploy documentation (main branch only) ────────────────────
  docs:
    name: Build and Deploy Docs
    runs-on: macos-26
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ hashFiles('.swift-version') }}

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build documentation
        run: bash Scripts/build-docs.sh

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.72.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test suite ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3-snapshot-2026-03-05"

      - name: Run tests
        run: swift test

      - name: Install WASM Embedded Swift SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.3-branch/wasm-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-03-05-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-03-05-a_wasm.artifactbundle.tar.gz --checksum fb8744a343c02277d3f695a524b9ddc3fee18b96396282a84f7fcf875602bdc6

      - name: Build embedded targets
        run: bash Scripts/build-embedded.sh
